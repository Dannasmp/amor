<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo para ti mis hoyuelitos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #05050a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #universe-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 600px;
            padding: 20px;
            transition: opacity 1s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            display: none !important;
        }

        .visible {
            opacity: 1;
            pointer-events: auto;
            display: block !important;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: 300;
        }

        p {
            font-size: 1.2rem;
            color: #d1d1d1;
            margin-bottom: 30px;
            line-height: 1.6;
            min-height: 60px;
        }

        .btn-continue {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #ffffff;
            padding: 10px 30px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn-continue:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ffffff;
        }

        .transition-burst {
            position: fixed;
            inset: 0;
            z-index: 20;
            overflow: hidden;
            visibility: hidden;
            pointer-events: none;
        }

        .transition-burst.active {
            visibility: visible;
        }

        .burst-flash {
            position: absolute;
            inset: 0;
            opacity: 0;
            background: radial-gradient(circle, #fff 0%, #fff 8%, rgba(255,255,255,.92) 20%, rgba(198,231,255,.55) 45%, transparent 74%);
            transform: scale(.02);
        }

        .transition-burst.active .burst-flash {
            animation: burst-flash 1.1s ease-out both;
        }

        @keyframes burst-flash {
            0% { opacity: 0; transform: scale(.02); }
            12% { opacity: 1; transform: scale(.55); }
            34% { opacity: 1; transform: scale(2.4); }
            100% { opacity: 0; transform: scale(3.2); }
        }

        .burst-core {
            position: absolute;
            left: 50%;
            top: 50%;
            width: clamp(100px, 28vmin, 360px);
            aspect-ratio: 1;
            border-radius: 50%;
            opacity: 0;
            background: radial-gradient(circle, #fff 0 8%, #fff9e8 18%, rgba(161,220,255,.9) 42%, rgba(125,170,255,.2) 68%, transparent 76%);
            box-shadow: 0 0 70px 28px rgba(255,255,255,.95), 0 0 180px 85px rgba(141,205,255,.7);
            transform: translate(-50%, -50%) scale(.02);
        }

        .transition-burst.active .burst-core {
            animation: core-detonate .75s ease-out both;
        }

        @keyframes core-detonate {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(.02); }
            12% { opacity: 1; transform: translate(-50%, -50%) scale(.85); }
            45% { opacity: .95; transform: translate(-50%, -50%) scale(1.6); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(2.8); }
        }

        .burst-ring {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100vmax;
            aspect-ratio: 1;
            border: clamp(3px, .7vw, 10px) solid rgba(255,255,255,.96);
            border-radius: 50%;
            opacity: 0;
            box-shadow: 0 0 26px 8px rgba(255,255,255,.85), inset 0 0 26px 8px rgba(190,226,255,.65);
            transform: translate(-50%, -50%) scale(.015);
        }

        .transition-burst.active .burst-ring {
            animation: shockwave .85s cubic-bezier(.08,.55,.18,1) both;
        }

        @keyframes shockwave {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(.015); }
            12% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
        }

        .burst-particle {
            position: absolute;
            left: 50%;
            top: 50%;
            opacity: 0;
            animation: particle-burst 1s cubic-bezier(.12,.72,.24,1) var(--delay, 0s) both;
        }

        .burst-particle.star {
            width: var(--size);
            height: var(--size);
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 18px 7px #fff, 0 0 34px 12px #8dceff;
        }

        @keyframes particle-burst {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(.1) rotate(0); }
            14% { opacity: 1; }
            100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1) rotate(var(--rotation)); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>

    <div id="transition-burst" class="transition-burst" aria-hidden="true">
        <div class="burst-flash"></div>
        <div class="burst-core"></div>
        <div class="burst-ring"></div>
        <div id="burst-particles"></div>
    </div>

    <!-- Fondo de estrellas (Canvas) -->
    <canvas id="universe-canvas"></canvas>

    <!-- Contenido principal de la historia -->
    <div id="main" class="container hidden">
        <h1 id="title-text"></h1>
        <p id="subtitle-text"></p>
        <button id="next-btn" class="btn-continue hidden">Continuar</button>
    </div>

    <script>
        // Configuración del fondo de estrellas animadas
        const canvas = document.getElementById('universe-canvas');
        const ctx = canvas.getContext('2d');

        let stars = [];
        const numStars = 180;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.005
            });
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) {
                    star.speed = -star.speed;
                }
            });
            requestAnimationFrame(animateStars);
        }
        animateStars();

        // Datos de constelaciones e historia (Versión exacta basada en el proyecto)
        const constellationData = [
            { title: "UN UNIVERSO PARA TI", subtitle: "ENCONTRÉ ALGO EN EL UNIVERSO QUE QUERÍA MOSTRARTE." },
            { title: "", subtitle: "Dicen que hay millones de estrellas..." },
            { title: "", subtitle: "pero ninguna podría iluminar mi vida como tú." },
            { title: "", subtitle: "Mi estrella favorita siempre serás tú, mis hoyuelitos." }
        ];

        let currentStep = 0;

        const burst = document.getElementById('transition-burst');
        const burstParticles = document.getElementById('burst-particles');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function runBurst(onComplete) {
            const count = 110;
            const distance = Math.hypot(window.innerWidth, window.innerHeight) * 0.72;
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i / count) + (Math.random() - 0.5) * 0.2;
                const radius = distance * (0.55 + Math.random() * 0.45);
                const particle = document.createElement('span');
                particle.className = 'burst-particle star';
                particle.style.setProperty('--x', `${Math.cos(angle) * radius}px`);
                particle.style.setProperty('--y', `${Math.sin(angle) * radius}px`);
                particle.style.setProperty('--size', `${5 + Math.random() * 9}px`);
                particle.style.setProperty('--delay', `${Math.random() * 0.12}s`);
                particle.style.setProperty('--rotation', `${Math.random() * 300 - 150}deg`);
                fragment.appendChild(particle);
            }

            burstParticles.replaceChildren(fragment);
            burst.classList.add('active');
            window.setTimeout(() => {
                burst.classList.remove('active');
                burstParticles.replaceChildren();
                onComplete();
            }, reduceMotion ? 120 : 1050);
        }

        function loadConstellation(index) {
            const btn = document.getElementById('next-btn');
            if (index < constellationData.length) {
                const data = constellationData[index];
                document.getElementById('title-text').innerText = data.title;
                document.getElementById('subtitle-text').innerText = data.subtitle;
                btn.innerText = 'Continuar';
                btn.classList.remove('hidden');
            } else {
                document.getElementById('title-text').innerText = "✨";
                document.getElementById('subtitle-text').innerText = "Fin del recorrido estelar para ti, mis hoyuelitos.";
                btn.innerText = 'Abrir tu propuesta';
                btn.classList.remove('hidden');
            }
        }

        function startExperience() {
            runBurst(() => {
                document.getElementById('main').classList.remove('hidden');
                loadConstellation(currentStep);
            });
        }

        document.getElementById('next-btn').addEventListener('click', () => {
            if (currentStep >= constellationData.length) {
                document.getElementById('next-btn').disabled = true;
                window.location.assign('Propuesta.html?fromUniverse=1');
                return;
            }
            currentStep++;
            loadConstellation(currentStep);
        });

        startExperience();
    </script>
</body>
</html>
