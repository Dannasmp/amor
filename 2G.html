<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Gallery - Para mi princesita</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #05030a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Pantalla de inicio exacta del video */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: radial-gradient(circle, #1a102f 0%, #080411 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }

        .card {
            background: rgba(25, 15, 45, 0.75);
            border: 1px solid rgba(255, 105, 180, 0.3);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 90%;
        }

        .card h1 {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #f3e7ff;
        }

        .card img {
            width: 140px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 8px rgba(255, 105, 180, 0.5));
        }

        .card p {
            font-size: 0.85rem;
            color: #d8b4fe;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .btn-start {
            background: linear-gradient(135deg, #4a1d63, #7e22ce);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            padding: 10px 40px;
            font-size: 0.95rem;
            border-radius: 30px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(126, 34, 206, 0.4);
        }

        .btn-start:hover {
            background: linear-gradient(135deg, #581c87, #9333ea);
            box-shadow: 0 6px 20px rgba(147, 51, 234, 0.6);
            transform: translateY(-2px);
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            display: none !important;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            z-index: 2;
            pointer-events: none;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Bienvenida (Inicio del video) -->
    <div id="start-overlay">
        <div class="card">
            <h1>Galaxy Gallery</h1>
            <!-- Ositos amorosos idénticos al video (GIF / Sticker ilustrativo) -->
            <img src="https://media.giphy.com/media/26vUGJMBbU3U9uNfG/giphy.gif" alt="Ositos enamorados">
            <p>Para mi princesita</p>
            <button class="btn-start" onclick="startExperience()">INICIAR</button>
        </div>
    </div>

    <div id="webgl-container"></div>

    <div class="instructions">
        <p>Arrastra para explorar el universo ✨</p>
    </div>

    <!-- Three.js y OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Función para generar una textura de partícula redonda y suave (evita cuadrados)
        function createCircularParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(32, 32, 32, 0, Math.PI * 2);
            ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05030a, 0.0015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 40, 70);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.4;
        controls.enabled = false; // Desactivado hasta que inicie

        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);

        const particleTexture = createCircularParticleTexture();

        // --- 1. TÚNEL / PARTÍCULAS REDONDAS DE ENTRADA ---
        const tunnelParticlesCount = 2000;
        const tunnelGeo = new THREE.BufferGeometry();
        const tunnelPos = new Float32Array(tunnelParticlesCount * 3);
        const tunnelCols = new Float32Array(tunnelParticlesCount * 3);

        const colorPalette = [
            new THREE.Color(0xff69b4), 
            new THREE.Color(0xffff00), 
            new THREE.Color(0x00ffff), 
            new THREE.Color(0xff1493)
        ];

        for (let i = 0; i < tunnelParticlesCount; i++) {
            const i3 = i * 3;
            tunnelPos[i3] = (Math.random() - 0.5) * 120;
            tunnelPos[i3 + 1] = (Math.random() - 0.5) * 120;
            tunnelPos[i3 + 2] = (Math.random() - 0.5) * 250 - 50;

            const col = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            tunnelCols[i3] = col.r;
            tunnelCols[i3 + 1] = col.g;
            tunnelCols[i3 + 2] = col.b;
        }

        tunnelGeo.setAttribute('position', new THREE.BufferAttribute(tunnelPos, 3));
        tunnelGeo.setAttribute('color', new THREE.BufferAttribute(tunnelCols, 3));
        
        const tunnelMat = new THREE.PointsMaterial({
            size: 1.5,
            map: particleTexture,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });
        const tunnelPoints = new THREE.Points(tunnelGeo, tunnelMat);
        scene.add(tunnelPoints);


        // --- 2. AGUJERO NEGRO Y GALAXIA ESPIRAL ---
        const galaxyGroup = new THREE.Group();
        galaxyGroup.position.set(0, -5, 0);
        scene.add(galaxyGroup);

        const coreGeo = new THREE.SphereGeometry(2.5, 32, 32);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        galaxyGroup.add(coreMesh);

        const diskGeo = new THREE.RingGeometry(2.7, 5.5, 64);
        const diskMat = new THREE.MeshBasicMaterial({ color: 0xffcc00, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
        const diskMesh = new THREE.Mesh(diskGeo, diskMat);
        diskMesh.rotation.x = Math.PI / 2;
        galaxyGroup.add(diskMesh);

        const beamGeo = new THREE.CylinderGeometry(0.4, 2.5, 30, 32, 1, true);
        const beamMat = new THREE.MeshBasicMaterial({ color: 0xff00ff, transparent: true, opacity: 0.7, side: THREE.DoubleSide, blending: THREE.AdditiveBlending });
        const beamMesh = new THREE.Mesh(beamGeo, beamMat);
        beamMesh.position.y = 15;
        galaxyGroup.add(beamMesh);

        // Estrellas de la Galaxia (Con esferas redondas)
        const particleCount = 7000;
        const geo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const colorInside = new THREE.Color(0xff69b4); 
        const colorOutside = new THREE.Color(0x8a2be2); 

        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            const radius = Math.random() * 45;
            const spinAngle = radius * 0.4;
            const branchAngle = ((i % 4) * Math.PI * 2) / 4;

            const rx = (Math.random() - 0.5) * 4;
            const ry = (Math.random() - 0.5) * 2;
            const rz = (Math.random() - 0.5) * 4;

            positions[i3] = Math.cos(branchAngle + spinAngle) * radius + rx;
            positions[i3 + 1] = ry;
            positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + rz;

            const mixedColor = colorInside.clone();
            mixedColor.lerp(colorOutside, radius / 45);
            colors[i3] = mixedColor.r;
            colors[i3 + 1] = mixedColor.g;
            colors[i3 + 2] = mixedColor.b;
        }

        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const galaxyMat = new THREE.PointsMaterial({
            size: 0.8,
            map: particleTexture,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const galaxyPoints = new THREE.Points(geo, galaxyMat);
        galaxyGroup.add(galaxyPoints);


        // --- 3. CORAZÓN GIGANTE DE PARTÍCULAS ---
        const heartParticlesCount = 1800;
        const heartGeo = new THREE.BufferGeometry();
        const heartPos = new Float32Array(heartParticlesCount * 3);
        const heartCols = new Float32Array(heartParticlesCount * 3);

        for (let i = 0; i < heartParticlesCount; i++) {
            const i3 = i * 3;
            const t = Math.random() * Math.PI * 2;
            
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            const z = (Math.random() - 0.5) * 6;

            heartPos[i3] = x * 0.9;
            heartPos[i3 + 1] = y * 0.9 + 25; 
            heartPos[i3 + 2] = z;

            heartCols[i3] = 1.0;
            heartCols[i3 + 1] = 0.2 + Math.random() * 0.4;
            heartCols[i3 + 2] = 0.7;
        }

        heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
        heartGeo.setAttribute('color', new THREE.BufferAttribute(heartCols, 3));
        
        const heartMat = new THREE.PointsMaterial({
            size: 1.0,
            map: particleTexture,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });
        const heartPoints = new THREE.Points(heartGeo, heartMat);
        scene.add(heartPoints);


        // --- 4. TEXTOS Y STICKERS FLOTANDO EN ÓRBITA ---
        const itemsData = [
            { type: 'text', content: 'MI CORAZÓN ES TUYO' },
            { type: 'text', content: 'CONTIGO SIEMPRE' },
            { type: 'text', content: 'INFINITO ∞' },
            { type: 'text', content: 'AMOR ETERNO' },
            { type: 'sticker', label: 'te amo ❤️' },
            { type: 'sticker', label: 'siempre juntos' }
        ];

        const orbitingSprites = [];

        itemsData.forEach((item, index) => {
            const canvasSprite = document.createElement('canvas');
            const context = canvasSprite.getContext('2d');
            canvasSprite.width = 512;
            canvasSprite.height = 128;

            if (item.type === 'text') {
                context.fillStyle = 'rgba(0, 0, 0, 0.4)';
                context.roundRect(10, 10, 492, 108, 20);
                context.fill();

                context.font = 'Bold 30px sans-serif';
                context.fillStyle = '#ffffff';
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                context.fillText(item.content, 256, 64);
            } else {
                context.fillStyle = 'rgba(255, 255, 255, 0.95)';
                context.beginPath();
                context.roundRect(50, 10, 412, 108, 30);
                context.fill();

                context.font = 'Bold 28px sans-serif';
                context.fillStyle = '#ff1493';
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                context.fillText(item.label, 256, 64);
            }

            const texture = new THREE.CanvasTexture(canvasSprite);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            
            sprite.scale.set(10, 2.5, 1);
            
            const angle = (index / itemsData.length) * Math.PI * 2;
            sprite.userData = { angle: angle, radius: 22 + Math.random() * 8, speed: 0.003 + Math.random() * 0.003 };
            
            scene.add(sprite);
            orbitingSprites.push(sprite);
        });


        // Función al hacer clic en "INICIAR"
        function startExperience() {
            document.getElementById('start-overlay').classList.add('hidden');
            controls.enabled = true;
        }


        // --- ANIMACIÓN PRINCIPAL ---
        function animate() {
            requestAnimationFrame(animate);

            galaxyPoints.rotation.y -= 0.0015;
            heartPoints.rotation.y += 0.005;
            tunnelPoints.rotation.z += 0.0005;

            orbitingSprites.forEach(sprite => {
                sprite.userData.angle += sprite.userData.speed;
                const x = Math.cos(sprite.userData.angle) * sprite.userData.radius;
                const z = Math.sin(sprite.userData.angle) * sprite.userData.radius;
                sprite.position.set(x, Math.sin(sprite.userData.angle * 2) * 4 + 5, z);
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
